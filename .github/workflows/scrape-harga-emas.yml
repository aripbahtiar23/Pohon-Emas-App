name: Scrape Harga Emas Harian

on:
  schedule:
    # Setiap hari 03:00 UTC = 10:00 WIB
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Bisa trigger manual dari GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install cheerio @supabase/supabase-js --no-save

      - name: Run scraper
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-harga-emas.js
